<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base1AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #050505;
            --surface: #0f0f0f;
            --border: #1d1d1d;
            --accent: #ffffff;
            --error: #ff3333;
            --text: #ececec;
            --text-dim: #666666;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        #container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            border-inline: 1px solid var(--border);
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
        }

        .logo {
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.85rem;
            color: var(--accent);
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            scrollbar-width: none;
        }
        #chat::-webkit-scrollbar { display: none; }

        .message-row {
            display: flex;
            gap: 1rem;
            width: 100%;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .ai-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 2px;
        }
        .ai-icon::after {
            content: "";
            width: 12px;
            height: 12px;
            border: 2px solid var(--bg);
            transform: rotate(45deg);
        }

        .msg {
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap; /* Essential for keeping line breaks and markdown spacing */
        }

        .user-row { justify-content: flex-end; }
        .user-msg {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
        }

        .ai-msg { padding-top: 4px; }

        .input-area { padding: 2rem; }

        .input-container {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        .blocked { animation: shake 0.2s ease-in-out 0s 2; border-color: var(--error) !important; }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px 16px;
            font-size: 0.95rem;
            outline: none;
        }

        button {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 0 1.2rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background: var(--accent); color: var(--bg); }
        button.locked { color: var(--error); border-color: var(--error); cursor: not-allowed; }

        .footer-meta {
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-top: 12px;
            text-align: center;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

<div id="container">
    <header>
        <div class="logo">BASE1AI</div>
        <div style="font-size: 0.65rem; color: var(--text-dim);">V 3.2 REV 8B</div>
    </header>

    <div id="chat"></div>

    <div class="input-area">
        <div class="input-container" id="inputBox">
            <input id="input" autocomplete="off" placeholder="Input command..." onkeydown="if(event.key==='Enter') send()">
            <button id="sendBtn" onclick="send()">RUN</button>
        </div>
        <div class="footer-meta">MODEL: BASE1AI-3.2-8B | COOLDOWN: 2.0S</div>
    </div>
</div>

<script>
    const API_KEY = "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";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indzendoc250c2xuZG1rbGNtbGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2OTM1ODYsImV4cCI6MjA4OTI2OTU4Nn0.YhW6Zx9QBtoP1-Jt3V62tiWj0VIsq2x4U2Fbsr7ZMWU";
    let lastRequestTime = 0;
    const COOLDOWN = 2000;
    let isGenerating = false;
    let isTyping = false;
    
    // System Personality History
    let history = [{
        role: "system",
        content: "You are Base1AI. Your name is Base1AI. You are a helpful assistant that answers clearly and concisely. Feel free to use emojis when necessary and the usage is appropriate."
    }];

    function addMessage(text, role) {
        const chat = document.getElementById("chat");
        const row = document.createElement("div");
        row.className = role === 'user' ? "message-row user-row" : "message-row";

        if (role === 'ai') {
            row.innerHTML = `
                <div class="ai-icon"></div>
                <div class="msg ai-msg"></div>
            `;
            chat.appendChild(row);
            typeWriter(text, row.querySelector(".ai-msg"));
        } else {
            row.innerHTML = `<div class="msg user-msg">${text}</div>`;
            chat.appendChild(row);
        }

        chat.scrollTop = chat.scrollHeight;
    }

    // Fixed Typewriter: Streams char-by-char to keep Markdown symbols (**) together
    function typeWriter(text, element) {
        let i = 0;
        let buffer = "";
        isTyping = true;
    
        function printChar() {
            if (i < text.length) {
                buffer += text.charAt(i);
                i++;
    
                // convert markdown each frame
                element.innerHTML = marked.parse(buffer);
    
                const chat = document.getElementById("chat");
                chat.scrollTop = chat.scrollHeight;
    
                let speed = 15;
                if (buffer.slice(-1) === '.' || buffer.slice(-1) === '!') speed = 180;
                if (buffer.slice(-1) === ',') speed = 80;
    
                setTimeout(printChar, speed);
            } else {
                // ✅ ONLY stop typing here
                isTyping = false;
                document.getElementById("chat").scrollTop = chat.scrollHeight;
            }
        }
    
        printChar();
    }

    function triggerBlock() {
        const box = document.getElementById("inputBox");
        const btn = document.getElementById("sendBtn");
        box.classList.add("blocked");
        btn.classList.add("locked");
        btn.innerText = "HALT";

        setTimeout(() => {
            box.classList.remove("blocked");
            btn.classList.remove("locked");
            btn.innerText = "RUN";
        }, 800);
    }

    async function send() {
        const now = Date.now();
        const input = document.getElementById("input");
        const btn = document.getElementById("sendBtn");
        const text = input.value.trim();
        
        if (isGenerating || isTyping) {
            triggerBlock();
            return;
        }
        
        if (btn.disabled || btn.classList.contains("locked")) return;

        if (now - lastRequestTime < COOLDOWN) {
            triggerBlock();
            return;
        }
        
        if (!text) return;

        input.value = "";
        addMessage(text, 'user');
        lastRequestTime = now;
        
        isGenerating = true;
        btn.disabled = true;
        btn.innerText = "...";

        history.push({ role: "user", content: text });

        try {
            const res = await fetch("https://wszwhsntslndmklcmlfz.supabase.co/functions/v1/chat", {
    method: "POST",
    headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "apikey": SUPABASE_ANON_KEY
    },
    body: JSON.stringify({
        messages: history
    })
});
        
        let data;
        try {
            data = await res.json();
        } catch (e) {
            isGenerating = false;
            btn.disabled = false;
            btn.innerText = "RUN";
            addMessage("Invalid server response.", 'ai');
            return;
        }
        
        // 🔴 ADD THIS CHECK
        if (!res.ok) {
            console.error("API Error:", data);
        
            isGenerating = false;
            btn.disabled = false;
            btn.innerText = "RUN";
        
            addMessage(
                data?.error?.message ||
                data?.message ||
                "API request failed.",
                'ai'
            );
            return;
        }
        
        // 🔴 SAFE ACCESS (prevents crash)
        const reply = data?.choices?.[0]?.message?.content;

        if (!reply) {
            console.error("No choices returned:", data);
            addMessage("No valid response from model.", 'ai');
            return;
        }
        
        history.push({ role: "assistant", content: reply });
        addMessage(reply, 'ai');

        } catch (err) {
            addMessage("Protocol error: check connection.", 'ai');
        } finally {
            isGenerating = false;
            btn.disabled = false;
            btn.innerText = "RUN";
        }
    }
</script>

</body>
</html>
