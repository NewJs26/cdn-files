<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mist Browser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --surface: #1e293b;
            --accent: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.2);
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Modern Toolbar */
        .toolbar {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 50;
        }

        .brand {
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px var(--accent-glow));
        }

        /* Refined Address Bar */
        .address-bar-container {
            flex-grow: 1;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .address-bar-container:focus-within {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
            transform: translateY(-1px);
        }

        #address-input {
            background: transparent;
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: 0.2px;
        }

        #address-input::placeholder {
            color: var(--text-dim);
        }

        /* Icon Buttons */
        .nav-btn {
            color: var(--text-dim);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
            transform: scale(1.05);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        /* Viewport Styling */
        .viewport {
            flex-grow: 1;
            position: relative;
            background: #ffffff;
            margin: 0 12px 12px 12px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        #browser-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Smooth Progress Bar */
        .loading-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #c084fc);
            width: 0%;
            transition: width 0.4s ease, opacity 0.3s ease;
            z-index: 100;
            box-shadow: 0 0 10px var(--accent);
        }

        /* Modern Error Screen */
        .error-overlay {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-main);
            z-index: 1000;
            text-align: center;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--accent-glow);
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="brand">MIST</div>
        
        <div class="flex gap-2">
            <div id="back-btn" class="nav-btn" title="Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </div>
            <div id="reload-btn" class="nav-btn" title="Reload">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8m0-5v5h-5"/></svg>
            </div>
        </div>

        <div class="address-bar-container">
            <div class="mr-3 opacity-40">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <input type="text" id="address-input" placeholder="Search or enter URL..." value="https://example.com">
        </div>

        <div class="flex gap-2">
            <div id="go-btn" class="nav-btn" style="color: var(--accent)" title="Go">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </div>
            <div id="fullscreen-btn" class="nav-btn" title="Toggle Fullscreen">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            </div>
        </div>
    </div>

    <div class="viewport" id="browser-viewport">
        <div id="loading-bar" class="loading-bar"></div>
        
        <div id="error-display" class="error-overlay">
            <div class="bg-slate-800/50 p-10 rounded-3xl border border-white/5 backdrop-blur-xl">
                <div class="mb-6 inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-500/10 text-indigo-400">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                </div>
                <h2 class="text-2xl font-extrabold text-white">Navigation Failed</h2>
                <p id="error-message" class="text-slate-400 mt-3 max-w-sm text-sm leading-relaxed"></p>
                <button onclick="retryNavigation()" class="mt-8 btn-primary">Try Again</button>
            </div>
        </div>

        <iframe id="browser-frame" name="browser-frame" src="about:blank" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture"></iframe>
    </div>

    <script>
        const PROXY_BASE = "https://wszwhsntslndmklcmlfz.supabase.co/functions/v1/v2_proxy?key=yourkey&url=";
        const AUTH_TOKEN = "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indzendoc250c2xuZG1rbGNtbGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2OTM1ODYsImV4cCI6MjA4OTI2OTU4Nn0.YhW6Zx9QBtoP1-Jt3V62tiWj0VIsq2x4U2Fbsr7ZMWU";

        const addressInput = document.getElementById("address-input");
        const browserFrame = document.getElementById("browser-frame");
        const loadingBar = document.getElementById("loading-bar");
        const errorDisplay = document.getElementById("error-display");
        const errorMessage = document.getElementById("error-message");
        const viewport = document.getElementById("browser-viewport");

        let lastUrl = "";

        function normalizeUrl(input) {
            let url = input.trim();
            if (!url) return "";
            if (!/^https?:\/\//i.test(url)) url = "https://" + url;
            return url;
        }

        async function navigate(inputUrl) {
            if (!inputUrl || inputUrl.startsWith("data:") || inputUrl.startsWith("blob:")) return;

            const url = normalizeUrl(inputUrl);
            lastUrl = url;
            addressInput.value = url;

            errorDisplay.style.display = "none";
            loadingBar.style.opacity = "1";
            loadingBar.style.width = "30%";

            try {
                const res = await fetch(PROXY_BASE + encodeURIComponent(url), {
                    headers: { Authorization: AUTH_TOKEN }
                });

                if (!res.ok) throw new Error(res.status);
                const type = res.headers.get("content-type") || "";

                if (type.includes("image/") || type.includes("video/") || type.includes("audio/")) {
                    const blob = await res.blob();
                    browserFrame.src = URL.createObjectURL(blob);
                } else {
                    let html = await res.text();
                    const injection = `
                    <base href="${url}">
                    <script>
                    (function () {
                        const PROXY_BASE = "${PROXY_BASE}";
                        const AUTH = "${AUTH_TOKEN}";
                        const pageOrigin = location.origin;

                        function shouldProxy(u) {
                            try {
                                const abs = new URL(u, document.baseURI).href;
                                if (abs.startsWith(pageOrigin)) return false;
                                const blocked = ["google-analytics.com", "doubleclick.net", "googletagmanager.com"];
                                return !blocked.some(d => abs.includes(d));
                            } catch { return false; }
                        }

                        function proxify(u) {
                            try {
                                const abs = new URL(u, document.baseURI).href;
                                return PROXY_BASE + encodeURIComponent(abs);
                            } catch { return u; }
                        }

                        const _fetch = window.fetch;
                        window.fetch = (url, opts = {}) => {
                            if (!shouldProxy(url)) return _fetch(url, opts);
                            opts.headers = { ...(opts.headers || {}), Authorization: AUTH };
                            return _fetch(proxify(url), opts);
                        };

                        const _open = XMLHttpRequest.prototype.open;
                        XMLHttpRequest.prototype.open = function (m, u, ...r) {
                            this._url = u;
                            return _open.call(this, m, shouldProxy(u) ? proxify(u) : u, ...r);
                        };

                        const _send = XMLHttpRequest.prototype.send;
                        XMLHttpRequest.prototype.send = function (b) {
                            if (this._url && shouldProxy(this._url)) {
                                this.setRequestHeader("Authorization", AUTH);
                            }
                            return _send.call(this, b);
                        };

                        document.addEventListener("click", (e) => {
                            const a = e.target.closest("a");
                            if (!a) return;
                            const href = a.getAttribute("href");
                            if (!href || href.startsWith("#") || href.startsWith("javascript:")) return;
                            e.preventDefault();
                            window.location.href = href;
                        }, true);
                    })();
                    <\/script>`;

                    if (html.includes("<head>")) html = html.replace("<head>", "<head>" + injection);
                    else if (html.includes("<html>")) html = html.replace("<html>", "<html><head>" + injection + "</head>");
                    else html = injection + html;

                    const blob = new Blob([html], { type: "text/html" });
                    browserFrame.src = URL.createObjectURL(blob);
                }

                loadingBar.style.width = "100%";
                setTimeout(() => {
                    loadingBar.style.opacity = "0";
                    setTimeout(() => loadingBar.style.width = "0%", 300);
                }, 400);

            } catch (err) {
                loadingBar.style.opacity = "0";
                errorDisplay.style.display = "flex";
                errorMessage.innerText = "The connection was interrupted by the proxy or the site is blocking access.";
                console.error(err);
            }
        }

        document.getElementById("go-btn").onclick = () => navigate(addressInput.value);
        document.getElementById("reload-btn").onclick = () => navigate(addressInput.value);
        document.getElementById("back-btn").onclick = () => {
            try { browserFrame.contentWindow.history.back(); } catch(e) { navigate(lastUrl); }
        };

        addressInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") navigate(addressInput.value);
        });

        document.getElementById("fullscreen-btn").onclick = () => {
            if (!document.fullscreenElement) viewport.requestFullscreen();
            else document.exitFullscreen();
        };

        function retryNavigation() {
            navigate(lastUrl);
        }

        window.onload = () => navigate(addressInput.value);
    </script>
</body>
</html>
