<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base1AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --bg: #050505;
            --surface: #0f0f0f;
            --border: #1d1d1d;
            --accent: #ffffff;
            --error: #ff3333;
            --text: #ececec;
            --text-dim: #666666;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        #container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            border-inline: 1px solid var(--border);
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
        }

        .logo {
            font-weight: 700;
            letter-spacing: 2px;
            font-size: 0.85rem;
            color: var(--accent);
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            scrollbar-width: none;
        }

        #chat::-webkit-scrollbar { display: none; }

        .message-row {
            display: flex;
            gap: 1rem;
            width: 100%;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .ai-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .ai-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            opacity: 0.9;
        }
        
        /* Supabase = green lightning */
        .indicator-supabase {
            background: #00ff88;
            box-shadow: 0 0 6px #00ff88;
        }
        
        /* Cloudflare = orange cloud */
        .indicator-cloudflare {
            background: #ff9a3c;
            box-shadow: 0 0 6px #ff9a3c;
        }

        .ai-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 2px;
        }

        .ai-icon::after {
            content: "";
            width: 12px;
            height: 12px;
            border: 2px solid var(--bg);
            transform: rotate(45deg);
        }

        .msg {
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-row { justify-content: flex-end; }

        .user-msg {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
        }

        .ai-msg { padding-top: 4px; }

        .input-area { padding: 2rem; }

        .input-container {
            display: flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px 16px;
            font-size: 0.95rem;
            outline: none;
        }

        button {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 0 1.2rem;
            border-radius: 4px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--accent);
            color: var(--bg);
        }

        .footer-meta {
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-top: 12px;
            text-align: center;
            letter-spacing: 1.5px;
        }
    </style>
</head>

<body>

<div id="container">
    <header>
        <div class="logo">BASE1AI</div>
        <div style="font-size: 0.65rem; color: var(--text-dim);">V 3.2 REV 8B</div>
    </header>

    <div id="chat"></div>

    <div class="input-area">
        <div class="input-container">
            <input id="input" autocomplete="off" placeholder="Input command..."
                   onkeydown="if(event.key==='Enter') send()">
            <button onclick="send()">RUN</button>
        </div>
        <div class="footer-meta">MODEL: BASE1AI-3.2-8B | COOLDOWN: 2.0S</div>
    </div>
</div>

<script>
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indzendoc250c2xuZG1rbGNtbGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2OTM1ODYsImV4cCI6MjA4OTI2OTU4Nn0.YhW6Zx9QBtoP1-Jt3V62tiWj0VIsq2x4U2Fbsr7ZMWU";

    const SUPABASE_URL =
        "https://wszwhsntslndmklcmlfz.supabase.co/functions/v1/chat";

    const CLOUDFLARE_URL =
        "https://chat-api.doorstester1920.workers.dev/";

    let lastRequestTime = 0;
    const COOLDOWN = 2000;
    let isGenerating = false;

    let history = [{
        role: "system",
        content: "You are Base1AI. Answer clearly and concisely."
    }];

    function addMessage(text, role, source = null) {
        const chat = document.getElementById("chat");
        const row = document.createElement("div");
        row.className = role === 'user' ? "message-row user-row" : "message-row";

        if (role === 'ai') {
            row.innerHTML = `
                <div class="ai-stack">
                    <div class="ai-icon"></div>
                    <div class="ai-indicator" id="indicator-${Date.now()}"></div>
                </div>
                <div class="msg ai-msg"></div>
            `;
            chat.appendChild(row);

            // get indicator element
            const indicator = row.querySelector(".ai-indicator");
            
            // decide which backend was used
            if (source === "supabase") {
                indicator.classList.add("indicator-supabase");
            } else if (source === "cloudflare") {
                indicator.classList.add("indicator-cloudflare");
            }
            
            row.querySelector(".ai-msg").innerHTML = marked.parse(text);
        } else {
            row.innerHTML = `<div class="msg user-msg">${text}</div>`;
            chat.appendChild(row);
        }

        chat.scrollTop = chat.scrollHeight;
    }

    async function callAPI(messages) {

    // TRY SUPABASE FIRST
    try {
        const res = await fetch(SUPABASE_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
                "apikey": SUPABASE_ANON_KEY
            },
            body: JSON.stringify({ messages })
        });

        const data = await res.json();
        if (!res.ok) throw new Error("Supabase failed");

        return { data, source: "supabase" };

    } catch (e) {

        const res = await fetch(CLOUDFLARE_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages })
        });

        const data = await res.json();
        if (!res.ok) throw new Error("Cloudflare failed");

        return { data, source: "cloudflare" };
    }
}

    async function send() {
        const input = document.getElementById("input");
        const text = input.value.trim();
        if (!text || isGenerating) return;

        input.value = "";
        addMessage(text, "user");

        history.push({ role: "user", content: text });

        isGenerating = true;

        try {
            const { data, source } = await callAPI(history);

            const reply =
                data?.choices?.[0]?.message?.content ??
                data?.message ??
                data?.reply ??
                (typeof data === "string" ? data : null);

            history.push({ role: "assistant", content: reply });
            addMessage(reply, "ai", source);

        } catch (err) {
            addMessage("Both servers failed.", "ai");
        }

        isGenerating = false;
    }
</script>

</body>
</html>
